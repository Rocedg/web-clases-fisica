<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="title desc">
  <title id="title">Vectores que entran y salen del papel</title>
  <desc id="desc">Símbolos de punto y cruz para representar sentidos perpendiculares al plano de la pantalla.</desc>
  <rect width="420" height="220" fill="#fff"/>
  <g transform="translate(120 110)">
    <circle r="46" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle r="7" fill="#2563eb"/>
    <text x="-55" y="78" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#111827">sale del papel</text>
  </g>
  <g transform="translate(300 110)" stroke="#f97316" stroke-width="5" stroke-linecap="round">
    <circle r="46" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <path d="M-19 -19 L19 19 M19 -19 L-19 19"/>
    <text x="-62" y="78" stroke="none" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#111827">entra en el papel</text>
  </g>
</svg>
