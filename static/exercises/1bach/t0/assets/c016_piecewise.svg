<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 260" role="img" aria-labelledby="title desc">
  <title id="title">Función por tramos continua</title>
  <desc id="desc">Función constante en 1, luego creciente linealmente hasta 5, y constante de nuevo hasta x igual a 6.</desc>
  <rect width="430" height="260" fill="#fff"/>
  <g transform="translate(54 212)">
    <path d="M0 0 H330" stroke="#475569" stroke-width="2"/>
    <path d="M0 0 V-180" stroke="#475569" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M100 0 V-180 M200 0 V-180 M300 0 V-180"/>
      <path d="M0 -40 H330 M0 -80 H330 M0 -120 H330 M0 -160 H330"/>
    </g>
    <path d="M0 -40 H100" stroke="#2563eb" stroke-width="3" fill="none"/>
    <path d="M100 -40 L200 -160" stroke="#f97316" stroke-width="3" fill="none"/>
    <path d="M200 -160 H300" stroke="#059669" stroke-width="3" fill="none"/>
    <g fill="#111827" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
      <text x="325" y="18">x</text><text x="-24" y="-176">f</text>
      <text x="-5" y="18">0</text><text x="94" y="18">2</text><text x="194" y="18">4</text><text x="294" y="18">6</text>
      <text x="-28" y="-36">1</text><text x="-28" y="-156">5</text>
    </g>
  </g>
</svg>
