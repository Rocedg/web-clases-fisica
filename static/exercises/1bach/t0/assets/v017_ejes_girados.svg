<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">Vector proyectado sobre ejes girados</title>
  <desc id="desc">Un vector azul se descompone en componentes sobre dos ejes girados respecto a la horizontal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="axis" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="420" height="240" fill="#fff"/>
  <g transform="translate(86 178) rotate(-28)" fill="none" stroke-linecap="round">
    <path d="M0 0 H250" stroke="#475569" stroke-width="2" marker-end="url(#axis)"/>
    <path d="M0 0 V-130" stroke="#475569" stroke-width="2" marker-end="url(#axis)"/>
    <path d="M0 0 L186 -72" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M186 -72 L186 0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M0 0 L186 0" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M186 0 L186 -72" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#111827">
    <text x="308" y="70">vector</text>
    <text x="282" y="202">eje s</text>
    <text x="34" y="72">eje n</text>
    <text x="238" y="170" fill="#059669">componente s</text>
    <text x="286" y="130" fill="#f97316">componente n</text>
  </g>
</svg>
