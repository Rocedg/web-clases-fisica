{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<section class="section-shell login-section">
    <div class="login-card panel-card">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='images/brand/web-clases-rocedg-logo.png') }}"
                 alt=""
                 class="login-logo">
            <div>
                <span class="brand-title">Web Clases Rocedg</span>
                <span class="brand-subtitle">Física</span>
            </div>
        </div>
        <span class="eyebrow">
            <i class="fas fa-lock" aria-hidden="true"></i>
            Acceso de estudiante
        </span>
        <h1 class="page-title fs-1">Iniciar sesión</h1>
        <p class="page-copy mb-4">Entra para acceder a apuntes, ejercicios e información de estudio.</p>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Usuario</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Contraseña</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-sign-in-alt me-1" aria-hidden="true"></i>Iniciar sesión
            </button>
        </form>
    </div>
</section>
{% endblock %}
