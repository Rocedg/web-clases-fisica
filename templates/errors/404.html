{% extends "base.html" %}
{% block title %}Página no encontrada{% endblock %}

{% block content %}
<section class="section-shell">
    <div class="panel-card text-center">
        <span class="error-icon text-warning"><i class="fas fa-question-circle"></i></span>
        <h1 class="page-title mx-auto">404</h1>
        <p class="page-copy mx-auto">
            {{ message|default("La página que buscas no existe o está en construcción.") }}
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg mt-4">
            <i class="fas fa-home me-1"></i>Volver al inicio
        </a>
    </div>
</section>
{% endblock %}
