{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}

{% block content %}
<section class="section-shell">
    <div class="panel-card text-center">
        <span class="error-icon text-danger"><i class="fas fa-bug"></i></span>
        <h1 class="page-title mx-auto">500</h1>
        <p class="page-copy mx-auto">
            {{ error|default("Ha ocurrido un error en el servidor. Por favor, inténtalo de nuevo más tarde.") }}
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg mt-4">
            <i class="fas fa-home me-1"></i>Volver al inicio
        </a>
    </div>
</section>
{% endblock %}
